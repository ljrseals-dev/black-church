<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1080" height="1080" fill="#f6f1e7"/>
<text x="540" y="110" text-anchor="middle" font-family="Georgia,serif" font-size="58" font-weight="700" fill="#14122b">A companion, not a ghostwriter</text>
<rect x="60" y="170" width="450" height="780" rx="24" fill="#14122b"/>
<rect x="570" y="170" width="450" height="780" rx="24" fill="#fff" stroke="#14122b" stroke-width="3"/>
<g font-family="Georgia,serif" font-size="34" fill="#fff">
<text x="100" y="250" font-size="40" font-weight="700" fill="#e8b04a">It will</text>
<text x="100" y="340">Ask before it answers</text>
<text x="100" y="420">Flag your agenda</text>
<text x="100" y="500">Ask for the verse</text>
<text x="100" y="580">Separate text from</text><text x="100" y="625">application</text>
<text x="100" y="705">Ask for your cloud of</text><text x="100" y="750">witnesses</text>
<text x="100" y="830">Quote the KJV, name it</text></g>
<g font-family="Georgia,serif" font-size="34" fill="#14122b">
<text x="610" y="250" font-size="40" font-weight="700" fill="#9b2c2c">It won't</text>
<text x="610" y="340">Write the sermon</text>
<text x="610" y="420">Speak for God</text>
<text x="610" y="500">Claim pastoral</text><text x="610" y="545">authority</text>
<text x="610" y="625">Flatten your tradition</text><text x="610" y="670">into a generic voice</text>
<text x="610" y="750">Invent sources</text></g>
<text x="540" y="1025" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#5c5670">Muse Sermon by Rihanna · Open source · MIT</text>
</svg>
